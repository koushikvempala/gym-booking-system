<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Approvals | Gym Booking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">GB</div><div><h1>Gym Booking</h1><p>Admin Panel</p></div></div>
      <nav class="nav">
        <a href="index.html">Dashboard</a><a href="add-manager.html">Managers</a><a href="manage-plans.html">Plans</a><a href="feedback.html">Feedback</a><a class="active" href="gym-approvals.html">Gym Approvals</a><a href="reports.html">Reports</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar"><div class="page-title"><h2>Gym Approvals</h2><p>Approve or reject gym enrollment requests.</p></div><span class="admin-chip">Approval Queue</span></header>
      <div id="notice" class="notice"></div>
      <section class="card">
        <div class="card-header">
          <h3>Registered Gyms</h3>
          <div class="search-row">
            <input id="gymSearch" placeholder="Search gyms or city">
            <select id="statusFilter"><option value="all">All status</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
          </div>
        </div>
        <div class="table-wrap"><table class="table table-hover align-middle"><thead><tr><th>Gym</th><th>Manager</th><th>Address</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead><tbody id="gymRows"></tbody></table></div>
      </section>
    </main>
  </div>
  <script src="js/data-store.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
