<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bookings | Manager Panel</title>
  <link rel="stylesheet" href="css/manager.css?v=2">
  <link rel="stylesheet" href="../common/css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Tabs for Bookings Page */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--brand);
      border-bottom-color: var(--brand);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>

<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <img src="../common/images/logo.png" alt="Gym Logo">
        </div>
        <div>
          <h1>Gym Booking</h1>
          <p>Manager Panel</p>
        </div>
      </div>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="manage-plans.html">Plans</a>
        <a href="manage-trainers.html">Trainers</a>
        <a href="manage-equipment.html">Equipment</a>
        <a href="manage-slots.html">Slots</a>
        <a class="active" href="bookings.html">Bookings</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="page-title">
          <h2>Bookings</h2>
          <p>View all confirmed bookings</p>
        </div>
        <div class="profile-dropdown">
          <button class="profile-btn">
            <span class="profile-emoji">
              <i class="fa-regular fa-user" style="color: black;"></i>
            </span>
            <span id="managerNameDisplay">Manager</span>
            <span id="dropwdownDisplay" style="font-size: 12px;"><i class="fa-solid fa-angle-down"></i></span>
          </button>
          <div class="dropdown-content">
            <div class="dropdown-header">
              <strong id="gymNameDisplay">Your Gym</strong>
              <small>Manager Account</small>
            </div>
            <a href="bookings.html">View Bookings</a>
            <a href="diet-plans.html">Diet Plans</a>
            <a href="buy-subscription.html">Buy Subscription</a>
            <a href="enroll-gym.html">Gym Profile</a>
            <a href="../common/components/logout.html" class="logout"
              onclick="alert('Logged out'); window.location.href='../common/components/logout.html';">Logout</a>
          </div>
        </div>
      </header>

      <section class="card">
        <div class="card-body">
          <div id="viewBookings" class="tab-content active">
            <div class="toolbar" style="margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap;">
              <input type="text" id="searchBooking" placeholder="Search by name or booking ID..." style="flex: 1; min-width: 200px; padding: 10px; border: 1px solid var(--line); border-radius: 4px;">
              <select id="filterPlan" style="padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: white;">
                <option value="">All Plans</option>
              </select>
            </div>
            <div class="table-wrap">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Booking ID</th>
                    <th>Customer Name</th>
                    <th>Plan</th>
                    <th>Start date</th>
                    <th>Valid till</th>
                    <th>Slot</th>
                    <th>Amount Paid</th>
                  </tr>
                </thead>
                <tbody id="bookingsTable">
                  <!-- Populated via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/data-store.js?v=5"></script>
  <script src="js/bookings.js?v=5"></script>
</body>

</html>
