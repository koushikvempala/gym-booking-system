<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Profile | Manager Panel</title>
    <link rel="stylesheet" href="css/manager.css?v=2">
</head>

<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">GB</div>
                <div>
                    <h1>Gym Booking</h1>
                    <p>Manager Panel</p>
                </div>
            </div>
            <nav class="nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="manage-plans.html">Plans</a>
                <a href="manage-trainers.html">Trainers</a>
                <a href="manage-equipment.html">Equipment</a>
                <a href="manage-slots.html">Slots</a>
                <a href="bookings.html">Bookings</a>
            </nav>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="page-title">
                    <h2>Gym Profile</h2>
                    <p>Enroll or update your gym's details on the platform.</p>
                </div>
                <div class="profile-dropdown">
                    <button class="profile-btn">
                        <span class="profile-emoji">👤</span>
                        <span id="managerNameDisplay">Manager</span>
                        <span style="font-size: 10px;">▼</span>
                    </button>
                    <div class="dropdown-content">
                        <div class="dropdown-header">
                            <strong id="gymNameDisplay">Your Gym</strong>
                            <small>Manager Account</small>
                        </div>
                        <a href="enroll-gym.html">Gym Profile</a>
                        <a href="bookings.html">View Bookings</a>
                        <a href="diet-plans.html">Diet Plans</a>
            <a href="buy-subscription.html">Buy Subscription</a>
            <a href="#" class="logout"
                            onclick="alert('Logged out'); window.location.href='../index.html';">Logout</a>
                    </div>
                </div>
            </header>

            <section class="grid">
                <article class="card">
                    <div class="card-header">
                        <h3>Gym Details</h3>
                    </div>
                    <div class="card-body">
                        <div id="saveNotice" class="notice">Changes saved successfully.</div>
                        <form id="gymForm">
                            <div class="grid two-col">
                                <div class="field">
                                    <label>Gym Name</label>
                                    <input type="text" id="gymName" required>
                                </div>
                                <div class="field">
                                    <label>Owner / Manager Name</label>
                                    <input type="text" id="managerName" required>
                                </div>
                            </div>
                            <div class="field">
                                <label>Description</label>
                                <textarea id="description" placeholder="Describe your facilities, vibe, and focus..."
                                    required></textarea>
                            </div>
                            <div class="grid two-col">
                                <div class="field">
                                    <label>Address</label>
                                    <input type="text" id="address" required>
                                </div>
                                <div class="field">
                                    <label>Opened On</label>
                                    <input type="date" id="openedOn" required>
                                </div>
                            </div>
                            <div class="grid two-col">
                                <div class="field">
                                    <label>Contact Number</label>
                                    <input type="tel" id="contactNumber" required>
                                </div>
                                <div class="field">
                                    <label>Email Address</label>
                                    <input type="email" id="email" required>
                                </div>
                            </div>
                            <div class="field">
                                <label>Website / Social Links</label>
                                <input type="text" id="website" placeholder="https://...">
                            </div>
                            <div class="toolbar" style="justify-content: flex-end; margin-top: 20px; gap: 10px;">
                                <button type="button" id="editBtn" class="btn secondary" style="display: none;">Edit
                                    Details</button>
                                <button type="submit" id="saveBtn" class="btn">Save Profile</button>
                            </div>
                        </form>
                    </div>
                </article>
            </section>
        </main>
    </div>
    <script src="js/data-store.js?v=3"></script>
    <script src="js/enroll-gym.js?v=3"></script>
</body>

</html>
