<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PulseFit | Premium Gym Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Book your gym slot with PulseFit - The Smart Gym Booking Platform">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="common/css/style.css">
</head>

<body>

    <div class="main-wrapper">
        <div class="background-overlay"></div>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg pulse-navbar fixed-top">
            <div class="container">
                <a class="navbar-brand fw-bold pulse-brand" href="#">
                    <i class="bi bi-activity"></i> PulseFit
                </a>
                <span class="navbar-text d-none d-md-block tagline">
                    Unleash Your Potential
                </span>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="container h-100">
                <div class="row h-100 align-items-center">
                    
                    <div class="col-lg-7 text-white hero-text-area">
                        <span class="hero-badge"><i class="bi bi-lightning-charge-fill text-warning"></i> Online Gym Booking System</span>
                        <h1 class="hero-title mt-3">
                            Elevate Your <span class="text-accent">Fitness</span> Journey
                        </h1>
                        <p class="hero-description mt-3">
                            Experience the most seamless gym booking platform. Whether you're pushing limits as a customer or managing operations, PulseFit is your digital partner.
                        </p>
                    </div>

                    <div class="col-lg-5">
                        <!-- Booking Card (Glassmorphism) -->
                        <div class="glass-card booking-card mt-5 mt-lg-0">
                            <h3 class="card-title text-center mb-4">Get Started</h3>
                            
                            <div class="mb-4">
                                <label for="role" class="form-label text-light">Select Your Journey</label>
                                <div class="input-group custom-select-wrapper">
                                    <span class="input-group-text bg-transparent border-end-0 text-white"><i class="bi bi-person-badge"></i></span>
                                    <select id="role" class="form-select custom-control border-start-0 ps-0">
                                        <option value="" selected disabled>Choose Role...</option>
                                        <option value="customer">Customer</option>
                                        <option value="manager">Gym Manager</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid gap-3 mt-4">
                                <button class="btn btn-pulse-primary btn-lg" onclick="openRegisterModal()">
                                    <span>Register Now</span> <i class="bi bi-arrow-right"></i>
                                </button>
                                <button class="btn btn-pulse-secondary btn-lg" onclick="openLoginModal()">
                                    <span>Sign In</span>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-modal">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title text-white" id="registerModalTitle">
                        <i class="bi bi-person-plus"></i> Register
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div id="registerFields" class="row g-3"></div>
                        <button type="submit" class="btn btn-pulse-primary w-100 mt-4 btn-lg">
                            Create Account
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title text-white" id="loginModalTitle">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div id="loginFields" class="row g-3"></div>
                        <button type="submit" class="btn btn-pulse-secondary w-100 mt-4 btn-lg">
                            Sign In
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="common/js/navigation.js"></script>

</body>

</html>
