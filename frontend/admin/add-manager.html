<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Manager | Gym Booking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">GB</div><div><h1>Gym Booking</h1><p>Admin Panel</p></div></div>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a><a class="active" href="add-manager.html">Managers</a><a href="manage-plans.html">Plans</a><a href="feedback.html">Feedback</a><a href="gym-approvals.html">Gym Approvals</a><a href="reports.html">Reports</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar"><div class="page-title"><h2>Add Manager</h2><p>Create and maintain manager records with verified contact details.</p></div><span class="admin-chip">Manager Administration</span></header>
      <div id="notice" class="notice"></div>
      <section class="grid two-col">
        <form id="managerForm" class="card">
          <div class="card-header"><h3>Manager Details</h3></div>
          <div class="card-body">
            <input type="hidden" id="userId">
            <div class="field"><label for="name">Full Name</label><input id="name" required placeholder="Enter manager name"></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="manager@example.com"></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" required pattern="^\+91\s?[6-9][0-9]{4}\s?[0-9]{5}$" placeholder="+91 90000 00000"></div>
            <div class="field"><label for="city">City</label><input id="city" placeholder="Bengaluru"></div>
            <div class="field"><label for="password">Temporary Password</label><input id="password" required minlength="6" placeholder="Minimum 6 characters"></div>
            <div class="field"><label for="status">Status</label><select id="status"><option value="active">Active</option><option value="pending">Pending</option><option value="inactive">Inactive</option></select></div>
            <div class="actions"><button class="btn" type="submit">Save Manager</button><button class="btn secondary" type="button" id="resetForm">Clear</button></div>
          </div>
        </form>
        <article class="card">
          <div class="card-header"><h3>Managers</h3><input id="managerSearch" placeholder="Search managers"></div>
          <div class="table-wrap"><table class="table table-hover align-middle"><thead><tr><th>Name</th><th>Email</th><th>City</th><th>Status</th><th>Actions</th></tr></thead><tbody id="managerRows"></tbody></table></div>
        </article>
      </section>
    </main>
  </div>
  <script src="js/data-store.js"></script>
  <script src="js/managers.js"></script>
</body>
</html>
