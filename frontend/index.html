<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gym Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="common/css/style.css">
</head>

<body>

    <div class="main-wrapper">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg gym-navbar">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">PulseFit</a>

                <span class="navbar-text d-none d-md-block">
                    Smart Gym Booking Platform
                </span>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="container">
                <div class="d-flex justify-content-center align-items-center vh-100">

                    <div class="col-lg-6">
                        <div class="hero-content">

                            <span class="hero-badge">
                                Online Gym Booking System
                            </span>

                            <h1 class="hero-title mt-4">
                                Book Your Gym Slot With a Modern Experience
                            </h1>

                            <p class="hero-description">
                                Register as a customer or manager and access a smooth
                                digital gym booking system.
                            </p>

                            <!-- Booking Card -->
                            <div class="booking-card mt-5">

                                <label for="role" class="form-label">
                                    Select Your Role
                                </label>

                                <select id="role" class="form-select custom-control">
                                    <option value="">Select Role</option>
                                    <option value="customer">Customer</option>
                                    <option value="manager">Manager</option>
                                </select>

                                <div class="button-area mt-4">

                                    <button class="btn primary-btn" onclick="openRegisterModal()">
                                        Register
                                    </button>

                                    <button class="btn secondary-btn" onclick="openLoginModal()">
                                        Login
                                    </button>

                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </section>

    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered modal-lg">

            <div class="modal-content custom-modal">

                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalTitle">
                        Register
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <form id="registerForm">

                        <div id="registerFields" class="row g-3"></div>

                        <button type="submit" class="btn primary-btn w-100 mt-4">
                            Create Account
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content custom-modal">

                <div class="modal-header">

                    <h5 class="modal-title" id="loginModalTitle">
                        Login
                    </h5>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="loginForm">

                        <div id="loginFields" class="row g-3"></div>

                        <button type="submit" class="btn secondary-btn w-100 mt-4">
                            Sign In
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="common/js/navigation.js"></script>

</body>

</html>
