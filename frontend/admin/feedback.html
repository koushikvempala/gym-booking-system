<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Gym Booking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">GB</div><div><h1>Gym Booking</h1><p>Admin Panel</p></div></div>
      <nav class="nav">
        <a href="index.html">Dashboard</a><a href="add-manager.html">Managers</a><a href="manage-plans.html">Plans</a><a class="active" href="feedback.html">Feedback</a><a href="gym-approvals.html">Gym Approvals</a><a href="reports.html">Reports</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar"><div class="page-title"><h2>Feedback</h2><p>Review customer comments and mark items as handled.</p></div><span class="admin-chip">Customer Voice</span></header>
      <div id="notice" class="notice"></div>
      <section class="card">
        <div class="card-header filter-header">
          <div>
            <h3>Feedback Records</h3>
            <p>Filter customer feedback by rating and review status.</p>
          </div>
          <div class="search-row filter-row">
            <label><span>Rating</span><select id="ratingFilter"><option value="all">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label>
            <label><span>Status</span><select id="statusFilter"><option value="all">All status</option><option value="new">New</option><option value="reviewed">Reviewed</option></select></label>
            <button class="btn secondary filter-clear" type="button" id="clearFilters">Clear Filters</button>
          </div>
        </div>
        <div class="table-wrap"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>User</th><th>Message</th><th>Rating</th><th>Status</th><th>Actions</th></tr></thead><tbody id="feedbackRows"></tbody></table></div>
      </section>
    </main>
  </div>
  <script src="js/data-store.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
